[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tallynet"
version = "0.1.0"
description = "TallyNet: tally-coded multi-bit weights (unary bit bags → encoded scalar per matrix entry)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TallyNet contributors" }]
keywords = ["neural-networks", "binary", "multi-bit", "unary", "tally", "quantization"]
dependencies = [
  "numpy",
  "torch>=2.2.0",
]

[project.optional-dependencies]
train = [
  "torchvision>=0.17.0",
]
dev = [
  "pytest",
  "ruff",
]

[tool.uv]
package = true

[project.scripts]
tallynet-mnist = "tallynet.cli:train_mnist"
tallynet-native = "tallynet.native:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tallynet*"]

[tool.setuptools.package-data]
tallynet = ["csrc/*", "lib/.gitkeep", "lib/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

# Ruff 0.16+ enables a large default rule set. Keep the classic bug-finding
# checks so CI does not fail on optional style nits (UP, PLR, …).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
